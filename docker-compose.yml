services:
  db:
    image: postgres:18
    container_name: db_shortener
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_shortener
    depends_on:
      db:
        condition: service_healthy
    hostname: web
    env_file: .env
    environment:
      # Override .env: inside Compose, host is the service name, not localhost
      DATABASE_DSN: postgres://postgres:postgres@db:5432/shortener?sslmode=disable
    ports:
      - 8000:8080

volumes:
  pgdata:
